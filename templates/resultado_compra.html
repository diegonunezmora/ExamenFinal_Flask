
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado de la compra</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main class="contenedor">
        <section class="tarjeta">
            <h1>Resultado de la compra</h1>

            <p>Nombre: <strong>{{ resultado.nombre }}</strong></p>
            <p>Total sin descuento: ${{ resultado.total }}</p>
            <p>Descuento aplicado: {{ resultado.porcentaje }}%</p>
            <p>Monto descontado: ${{ resultado.descuento }}</p>

            <h2>Total a pagar: ${{ resultado.total_pagar }}</h2>

            <a href="/ejercicio1" class="boton">Nueva compra</a>
            <a href="/" class="volver">Volver al menú principal</a>
        </section>
    </main>

</body>
</html>
